<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   width="64px"
   height="64px"
   viewBox="0 0 64 64"
   id="svg2816"
   version="1.1">
  <defs
     id="defs2818">
    <linearGradient
       id="baseBlue"
       x1="0"
       y1="46"
       x2="0"
       y2="61"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         style="stop-color:#729fcf;stop-opacity:1" />
      <stop
         offset="1"
         style="stop-color:#204a87;stop-opacity:1" />
    </linearGradient>
    <linearGradient
       id="steel"
       x1="0"
       y1="18"
       x2="0"
       y2="47"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         style="stop-color:#eeeeec;stop-opacity:1" />
      <stop
         offset="1"
         style="stop-color:#888a85;stop-opacity:1" />
    </linearGradient>
    <linearGradient
       id="stock"
       x1="0"
       y1="4"
       x2="0"
       y2="40"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         style="stop-color:#fff110;stop-opacity:1" />
      <stop
         offset="1"
         style="stop-color:#cf7008;stop-opacity:1" />
    </linearGradient>
    <linearGradient
       id="handle"
       x1="0"
       y1="20"
       x2="10"
       y2="56"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         style="stop-color:#d3d7cf;stop-opacity:1" />
      <stop
         offset="1"
         style="stop-color:#555753;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g
     id="layer1">
    <!-- the handle: a lever on the screw's end, a knob on its arm -->
    <path
       id="handleArm"
       d="M 7.5,51 L 4,25"
       style="fill:none;stroke:#2e3436;stroke-width:5;stroke-linecap:round" />
    <path
       id="handleArmFill"
       d="M 7.5,51 L 4,25"
       style="fill:none;stroke:url(#handle);stroke-width:2.5;stroke-linecap:round" />
    <circle
       id="handleKnob"
       cx="4"
       cy="23"
       r="3"
       style="fill:url(#handle);stroke:#2e3436;stroke-width:1.5" />
    <rect
       id="handleSocket"
       x="3"
       y="47"
       width="8"
       height="9"
       rx="1"
       style="fill:url(#handle);stroke:#2e3436;stroke-width:2;stroke-linejoin:round" />
    <!-- the base, blue as a Kurt's -->
    <rect
       id="base"
       x="10"
       y="46"
       width="52"
       height="15"
       rx="1"
       style="fill:url(#baseBlue);stroke:#0b1e3d;stroke-width:2;stroke-linejoin:round" />
    <path
       id="baseShine"
       d="M 12,48.5 H 60"
       style="fill:none;stroke:#ffffff;stroke-opacity:0.5;stroke-width:1" />
    <!-- the stock held between the jaws -->
    <rect
       id="workpiece"
       x="28"
       y="4"
       width="16"
       height="36"
       style="fill:url(#stock);stroke:#653504;stroke-width:2;stroke-linejoin:round" />
    <path
       id="workpieceShine"
       d="M 30.5,6.5 V 37.5"
       style="fill:none;stroke:#ffffff;stroke-opacity:0.55;stroke-width:1" />
    <!-- the moving jaw -->
    <path
       id="movingJaw"
       d="M 14,24 H 28 V 46 H 14 Z"
       style="fill:url(#steel);stroke:#2e3436;stroke-width:2;stroke-linejoin:round" />
    <!-- the fixed jaw -->
    <path
       id="fixedJaw"
       d="M 44,19 H 61 V 46 H 44 Z"
       style="fill:url(#steel);stroke:#2e3436;stroke-width:2;stroke-linejoin:round" />
    <!-- their jaw plates -->
    <path
       id="jawPlates"
       d="M 25,24.5 V 45.5 M 47,19.5 V 45.5"
       style="fill:none;stroke:#555753;stroke-width:1.5" />
    <path
       id="jawShine"
       d="M 16,26.5 H 23 M 50,21.5 H 59"
       style="fill:none;stroke:#ffffff;stroke-opacity:0.7;stroke-width:1" />
  </g>
</svg>
